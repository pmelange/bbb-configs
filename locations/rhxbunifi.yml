  - vid: 40
    role: dhcp
    inbound_filtering: true
    enforce_client_isolation: true
    prefix: 10.36.198.240/28
    ipv6_subprefix: 0
    assignments:
      rhxb-unifi-core: 1

  - vid: 42
    name: mgmt
    role: dhcp # we wanna do dhcp for the access points
    prefix: 10.248.91.128/25
    gateway: 1
    dns: 1
    ipv6_subprefix: 1
    assignments:
      rhxb-unifi-core: 1
      rhxb-unifi-switch-roof: 2
      rhxb-unifi-cloudkey: 3

      # PTP
      rhxb-unifi-l105: 4
      rhxb-unifi-flughafen: 5
      rhxb-unifi-manstein: 6
      rhxb-unifi-rhnk: 8
      rhxb-unifi-dtmb: 9
      rhxb-unifi-simeon: 14

      # PTMP
      rhxb-unifi-no-5ghz: 10
      rhxb-unifi-sw-5ghz: 12
      rhxb-unifi-so-5ghz: 13
      rhxb-unifi-nw-5ghz: 15
      rhxb-unifi-dragon: 17

