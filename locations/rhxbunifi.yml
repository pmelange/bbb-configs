---

location: rhxbunifi
location_nice: Rathaus Kreuzberg
#latitude: 52.493778
#longitude: 13.385290
altitude: 74
community: berlin

hosts:
  - hostname: rhxb-unifi-core
    role: corerouter
    model: "tplink_tl-wdr4900-v1"
    wireless_profile: testunifi
    host__rclocal__to_merge:
      - |
        uci -q get system.@system[0].bbb_config_first_boot > /dev/null
        if [ "1" -eq $? ]; then
          uci set network.udmv4='route'
          uci set network.udmv4.interface='mgmt'
          uci set network.udmv4.target='10.248.91.192/26'
          uci set network.udmv4.gateway='10.248.91.131'
          uci set network.udmv6='route6'
          uci set network.udmv6.interface='mgmt'
          uci set network.udmv6.target='2001:bf7:750:ba02::/64'
          uci set network.udmv6.gateway='2001:bf7:750:ba01::131'
          uci commit network
          /etc/init.d/dnsmasq restart
          # Prevent this from running again by setting a config option
          uci set system.@system[0].bbb_config_first_boot=1
          uci commit system
          # reload the config to accept these changes
          reload_config
        fi

