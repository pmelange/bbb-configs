ipv6_prefix: "2001:bf7:750:ba00::/56"

# Rhxb got following prefixes:
# DHCP: 10.36.198.240/28
# Router: 
# --MGMT: 10.248.91.128/25
# --MESH: 10.36.199.0/28

# Disable noping as we use dhcp and static assignments
# both in mgmt network
